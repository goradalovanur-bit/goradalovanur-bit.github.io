<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Riyaziyyat Jurnalı</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
</head>

<body class="admin-body">

  <div class="admin-shell">

    <!-- ===================== ADMIN SIDEBAR ===================== -->
    <aside class="admin-sidebar">
      <a class="brand" href="index.html">
        <span class="brand-mark">∫</span>
        <span class="brand-sub">Admin Panel</span>
      </a>

      <nav class="admin-nav">
        <button class="admin-nav-btn is-active" data-panel="items" type="button">All Items</button>
        <button class="admin-nav-btn" data-panel="editor" type="button">Add New Item</button>
        <button class="admin-nav-btn" data-panel="settings" type="button">GitHub Settings</button>
      </nav>

      <div class="conn-status" id="connStatus">
        <span class="conn-dot"></span>
        <span id="connLabel">Not connected</span>
      </div>

      <a class="back-link" href="index.html">← Back to site</a>
    </aside>

    <!-- ===================== ADMIN MAIN ===================== -->
    <main class="admin-main">

      <!-- ---- ALL ITEMS ---- -->
      <section class="admin-panel is-active" id="panel-items">
        <div class="panel-head">
          <h1>All Items</h1>
          <div class="panel-head-tools">
            <input type="text" id="itemsSearch" placeholder="Filter items…" class="admin-input admin-input--sm">
            <select id="itemsTypeFilter" class="admin-input admin-input--sm">
              <option value="all">All types</option>
              <option value="problems">Problems</option>
              <option value="stories">Insights</option>
              <option value="code_animations">Codes</option>
              <option value="youtube">YouTube</option>
              <option value="pdf">PDF</option>
            </select>
          </div>
        </div>
        <div class="items-table" id="itemsTable"></div>
      </section>

      <!-- ---- EDITOR ---- -->
      <section class="admin-panel" id="panel-editor">
        <div class="panel-head">
          <h1 id="editorHeading">Add New Item</h1>
        </div>

        <div class="field-group">
          <label class="field-label">Content type</label>
          <select id="typeSelect" class="admin-input">
            <option value="problems">Solved Problem</option>
            <option value="stories">Math Insight (Story)</option>
            <option value="code_animations">Codes (Code &amp; Animation)</option>
            <option value="youtube">YouTube Video</option>
            <option value="pdf">PDF Document</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label">Title</label>
          <input type="text" id="f_title" class="admin-input" placeholder="Item title…">
        </div>

        <div id="typeFields"></div>

        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Date</label>
            <input type="date" id="f_date" class="admin-input">
          </div>
          <div class="field-group field-group--grow">
            <label class="field-label">Tags</label>
            <div class="tag-input" id="tagInput">
              <input type="text" id="f_tagEntry" placeholder="Press Enter or comma to add…">
            </div>
          </div>
        </div>

        <div class="editor-actions">
          <button class="admin-btn admin-btn--ghost" id="cancelEditBtn" type="button">Cancel</button>
          <button class="admin-btn admin-btn--primary" id="saveItemBtn" type="button">Save to List</button>
        </div>
      </section>

      <!-- ---- GITHUB SETTINGS ---- -->
      <section class="admin-panel" id="panel-settings">
        <div class="panel-head"><h1>GitHub Settings</h1></div>

        <p class="settings-note">
          Uses a fine-grained Personal Access Token scoped to <strong>Contents: Read and write</strong>
          on a single repository. The token is stored only in this browser's <code>localStorage</code>
          and is sent only to <code>api.github.com</code>.
        </p>

        <div class="field-group">
          <label class="field-label">Personal Access Token</label>
          <input type="password" id="s_token" class="admin-input" placeholder="github_pat_…" autocomplete="off">
        </div>
        <div class="field-row">
          <div class="field-group field-group--grow">
            <label class="field-label">Repository owner</label>
            <input type="text" id="s_owner" class="admin-input" placeholder="username">
          </div>
          <div class="field-group field-group--grow">
            <label class="field-label">Repository name</label>
            <input type="text" id="s_repo" class="admin-input" placeholder="username.github.io">
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Branch</label>
            <input type="text" id="s_branch" class="admin-input" placeholder="main" value="main">
          </div>
          <div class="field-group field-group--grow">
            <label class="field-label">Path to data.json</label>
            <input type="text" id="s_path" class="admin-input" placeholder="data.json" value="data.json">
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">PDF asset folder</label>
          <input type="text" id="s_pdfDir" class="admin-input" placeholder="assets/pdf/" value="assets/pdf/">
        </div>

        <div class="editor-actions">
          <button class="admin-btn admin-btn--ghost" id="clearTokenBtn" type="button">Clear Token</button>
          <button class="admin-btn admin-btn--primary" id="testConnBtn" type="button">Save &amp; Test Connection</button>
        </div>
      </section>

    </main>
  </div>

  <!-- ===================== STAGED CHANGES BAR ===================== -->
  <div class="stage-bar" id="stageBar" hidden>
    <span id="stageCount">0 staged changes</span>
    <div class="stage-bar-actions">
      <button class="admin-btn admin-btn--ghost" id="copyJsonBtn" type="button">Copy JSON</button>
      <button class="admin-btn admin-btn--primary" id="commitBtn" type="button">Commit to GitHub</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="admin.js"></script>
</body>

</html>
