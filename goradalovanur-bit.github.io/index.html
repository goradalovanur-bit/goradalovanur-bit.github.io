<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anur Qoradalov</title>
  <meta name="description"
    content="Notes, proofs, mathematical problems, insights, Manim animations, and code by Anur Qoradalov.">
  <meta property="og:title" content="Anur Qoradalov">
  <meta property="og:description" content="Notes, proofs, mathematical problems, insights, Manim animations, and code by Anur Qoradalov.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://goradalovanur-bit.github.io/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Anur Qoradalov">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>∫</text></svg>">

  <!-- Immediate Theme Initialization to Prevent Screen Flashing (FOUC) -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true,
        packages: { '[+]': ['ams', 'newcommand', 'noundefined', 'color'] },
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      chtml: {
        scale: 1.04,
        displayAlign: 'center',
        displayIndent: '0'
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>

<body>

  <!-- SVG Icon Sprite -->

        <polyline points="8 8 4 12 8 16" /><polyline points="16 8 20 12 16 16" /><line x1="13" y1="6" x2="11" y2="18" />
      </symbol>
      <symbol id="icon-about" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />

      </symbol>
      <symbol id="icon-youtube" viewBox="0 0 24 24" fill="currentColor">
        <path d="M23 12.2s-.2-3.3-1-4.7c-.9-1.2-1.9-1.2-2.4-1.3C16.8 6 12 6 12 6s-4.8 0-7.6.2c-.5.1-1.5.1-2.4 1.3-.8 1.4-1 4.7-1 4.7S1.2 16 2 17.5c.9 1.2 2.1 1.2 2.6 1.3C7.2 19 12 19 12 19s4.8 0 7.6-.2c.5-.1 1.7-.1 2.6-1.3.8-1.5 1-4.3 1-4.3zM9.8 15.5v-6.6l6.2 3.3-6.2 3.3z"/>

      <symbol id="icon-instagram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">

      </symbol>
      <symbol id="icon-tiktok" viewBox="0 0 24 24" fill="currentColor">

  </svg>

  <div class="site-shell">
    <!-- Backdrop for mobile drawer nav -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Permanent Medium-style Fixed Sidebar for Desktop (Drawer on Mobile) -->
    <aside class="sidebar-left" id="sidebarLeft" aria-label="Main Navigation">
      <div class="sidebar-top">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">∫</div>
          <div class="brand-text">
            <a href="#" class="brand-name" id="brandName">Anur Qoradalov</a>
            <p class="brand-role" id="brandRole">Mathematics Student</p>
          </div>
        </div>

        <!-- Desktop Theme Toggle -->
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" aria-hidden="true"><use href="#icon-sun" /></svg>
          <svg class="icon-moon" aria-hidden="true"><use href="#icon-moon" /></svg>
        </button>
      </div>

      <!-- Navigation Menu -->
      <nav class="side-nav" aria-label="Sections">
        <button class="side-nav-btn is-active" data-section="home" type="button">
          <svg aria-hidden="true"><use href="#icon-home" /></svg>
          <span>Home</span>
        </button>
        <button class="side-nav-btn" data-section="problems" type="button">
          <svg aria-hidden="true"><use href="#icon-problems" /></svg>
          <span>Problems</span>
        </button>
        <button class="side-nav-btn" data-section="insights" type="button">
          <svg aria-hidden="true"><use href="#icon-insights" /></svg>
          <span>Insights</span>
        </button>
        <button class="side-nav-btn" data-section="codes" type="button">
          <svg aria-hidden="true"><use href="#icon-codes" /></svg>
          <span>Codes</span>
        </button>
        <button class="side-nav-btn" data-section="about" type="button">
          <svg aria-hidden="true"><use href="#icon-about" /></svg>
          <span>About</span>
        </button>
      </nav>

      <!-- Mini Profile & Social Links at bottom of sidebar -->
      <div class="about-mini" id="aboutMini">
        <div class="about-mini-head">
          <div class="avatar" id="authorAvatar" aria-hidden="true">AQ</div>
          <div class="about-mini-meta">
            <p class="about-mini-name" id="aboutMiniName">Anur Qoradalov</p>
            <p class="about-mini-kicker">About Author</p>
          </div>
        </div>
        <p class="about-mini-bio" id="aboutMiniBio"></p>
        <div class="social-row" id="socialRow" aria-label="Social media profiles"></div>
      </div>
    </aside>

    <!-- Main Content Stream / Feed -->
    <main class="feed" id="feedMain">
      <!-- Feed Top Header -->
      <header class="feed-top">
        <div class="feed-top-left">
          <!-- Mobile Hamburger Toggle (hidden on desktop >= 1024px) -->
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation menu">
            <svg aria-hidden="true"><use href="#icon-menu" /></svg>
          </button>
          <div>
            <h1 class="feed-title" id="feedTitle">Home</h1>
            <p class="feed-sub" id="feedSub">Latest notes, problems, and media.</p>
          </div>
        </div>

        <!-- Mobile Header Theme Toggle (convenient for mobile users) -->
        <div class="feed-top-right">
          <button class="theme-toggle mobile-theme-toggle" id="mobileThemeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg class="icon-sun" aria-hidden="true"><use href="#icon-sun" /></svg>
            <svg class="icon-moon" aria-hidden="true"><use href="#icon-moon" /></svg>
          </button>
        </div>
      </header>

      <!-- Search and Filter Bar -->
      <div class="toolbar" id="feedToolbar">
        <div class="toolbar-controls">
          <div class="search-field">
            <svg aria-hidden="true"><use href="#icon-search" /></svg>
            <input type="text" id="searchInput" placeholder="Search titles, tags, content…" autocomplete="off">
            <button class="search-clear-btn" id="searchClearBtn" type="button" aria-label="Clear search" hidden>
              <svg aria-hidden="true"><use href="#icon-close" /></svg>
            </button>
          </div>

          <!-- Dedicated Filter Action Button -->
          <button class="filter-toggle-btn" id="filterToggleBtn" type="button" aria-expanded="false" aria-controls="filterPanel">
            <svg class="icon-filter-svg" aria-hidden="true"><use href="#icon-filter" /></svg>
            <span class="filter-label-text">Filter</span>
            <span class="active-filter-badge" id="activeFilterBadge" hidden></span>
            <svg class="icon-chevron-svg" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
          </button>
        </div>

        <!-- Collapsible Filter Tag Dropdown Tray (Hidden by default) -->
        <div class="filter-panel" id="filterPanel" hidden>
          <div class="filter-panel-inner">
            <div class="filter-panel-header">
              <span class="filter-panel-title">Filter by Topic</span>
              <button class="filter-reset-btn" id="filterResetBtn" type="button">Reset</button>
            </div>
            <div class="type-filters" id="tagFilters" role="group" aria-label="Filter by tag"></div>
          </div>
        </div>
      </div>

      <!-- Feed Grid of Entries (Reverse-Chronological) -->
      <section class="entries-feed" id="entriesGrid" aria-live="polite"></section>

      <!-- Empty State Indicator -->
      <div class="empty-state" id="emptyState" hidden>
        <svg aria-hidden="true"><use href="#icon-empty" /></svg>
        <p>Nothing matches that search or filter yet.</p>
        <button class="btn btn-primary" id="emptyResetBtn" type="button">Show All Items</button>
      </div>

      <!-- Dedicated About Page View -->
      <section class="about-page" id="aboutPage" hidden>
        <article class="about-card">
          <div class="about-card-head">
            <div class="avatar avatar-lg" id="aboutPageAvatar" aria-hidden="true">AQ</div>
            <div>
              <h2 id="aboutPageName">Anur Qoradalov</h2>
              <p class="role" id="aboutPageRole">Mathematics Student</p>
            </div>
          </div>
          <div class="about-page-bio" id="aboutPageBio"></div>
          <div class="social-row social-row-lg" id="aboutPageSocial"></div>
        </article>
      </section>
    </main>

    <!-- Right-Hand Widget Bar on Large Desktop Screens -->
    <aside class="sidebar-right" id="sidebarRight" aria-label="Related content">
      <div class="widget">
        <h2>Recent</h2>
        <ul class="recent-list" id="recentList"></ul>
      </div>
      <div class="widget">
        <h2>Topics</h2>
        <div class="topic-cloud" id="topicCloud"></div>
      </div>
    </aside>
  </div>

  <!-- Video & PDF Modal Player -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close modal">
          <svg aria-hidden="true"><use href="#icon-close" /></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© <span id="year">2026</span> Anur Qoradalov <span class="fmark">·</span> <a class="admin-link" href="admin.html">Admin</a></p>
  </footer>

  <script src="app.js"></script>
</body>

</html>
